name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - run: sudo apt-get install -y poppler-utils
      - name: Assemble public site
        run: |
          mkdir -p _site/assets _site/resume _site/recommendations _site/pr-stats
          cp index.html style.css favicon.ico manifest.json robots.txt CNAME resume.pdf resume.docx recommendations.pdf recommendations.docx _site/
          cp assets/android-chrome-192x192.png assets/android-chrome-512x512.png assets/apple-touch-icon.png assets/favicon.png assets/safari-pinned-tab.svg assets/script.js assets/timeline.js assets/share.jpg _site/assets/
          cp pr-stats/index.html _site/pr-stats/
          for doc in resume recommendations; do
            cp "$doc/index.html" "$doc/thumb.jpg" "_site/$doc/"
            pdftocairo -png -r 200 "$doc.pdf" "_site/$doc/page"
          done
          cd _site
          python ../generator/cachebust.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
