<!DOCTYPE html>
<html>
  <head>
    <title>Recommendations &mdash; Rod Boev</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="darkreader-lock" />
    <meta name="description" content="Recommendations from colleagues and clients across NBC Sports, Victoria's Secret, agency partnerships, and direct engagements." />
    <meta property="og:title" content="Recommendations">
    <meta property="og:description" content="Recommendations from colleagues and clients across NBC Sports, Victoria's Secret, agency partnerships, and direct engagements.">
    <meta property="og:image" content="https://basedin.nyc/recommendations/thumb.jpg">
    <meta property="og:url" content="https://basedin.nyc/recommendations">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/previews.css" />
  </head>
  <body>
    <a class="btn download" href="/recommendations.pdf" download>Download PDF</a>
    <script src="/pdfjs-dist/build/pdf.min.js"></script>
    <script>
      pdfjsLib.getDocument('/recommendations.pdf').promise.then(function(pdf) {
        var pages = [];
        for (var i = 1; i <= pdf.numPages; i++) pages.push(i);
        pages.reduce(function(chain, pageNum) {
          return chain.then(function() {
            return pdf.getPage(pageNum).then(function(page) {
              var scale = Math.min(1600, window.innerWidth * 0.96 * window.devicePixelRatio) / page.getViewport({ scale: 1 }).width;
              var viewport = page.getViewport({ scale: scale });
              var canvas = document.createElement('canvas');
              canvas.width = viewport.width;
              canvas.height = viewport.height;
              canvas.style.width = (viewport.width / window.devicePixelRatio) + 'px';
              document.body.appendChild(canvas);
              return page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
            });
          });
        }, Promise.resolve());
      });
    </script>
  </body>
</html>
