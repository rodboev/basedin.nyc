<!DOCTYPE html>
<html>
  <head>
    <title>Recommendations &mdash; Rod Boev</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="darkreader-lock" />
    <meta name="description" content="Recommendations from colleagues and clients across NBC Sports, Victoria's Secret, agency partnerships, and direct engagements." />
    <meta property="og:title" content="Recommendations">
    <meta property="og:description" content="Recommendations from colleagues and clients across NBC Sports, Victoria's Secret, agency partnerships, and direct engagements.">
    <meta property="og:image" content="https://basedin.nyc/recommendations/thumb.jpg">
    <meta property="og:url" content="https://basedin.nyc/recommendations">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="preview" data-pages="6" data-pdf="/recommendations.pdf">
    <a class="btn back" href="/"><svg viewBox="0 0 16 16" width="1em" height="1em"><path d="M10 2L4 8l6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <script>
      var dir = location.pathname.replace(/\/$/, '');
      var pages = parseInt(document.body.dataset.pages);
      var pdfAttr = document.body.dataset.pdf || '';
      var ver = (pdfAttr.match(/\?(.*)/) || [])[1] || '';
      var w = Math.min(720, window.innerWidth * 0.96);
      for (var i = 1; i <= pages; i++) {
        var obj = document.createElement('object');
        obj.type = 'image/svg+xml';
        obj.data = dir + '/page' + i + '.svg' + (ver ? '?' + ver : '');
        obj.style.width = w + 'px';
        obj.style.height = (w * 792 / 612) + 'px';
        document.body.appendChild(obj);
      }
    </script>
  </body>
</html>
