<!DOCTYPE html>
<html>
  <head>
    <title>Resume &mdash; Rod Boev</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="darkreader-lock" />
    <meta property="og:title" content="Resume - Rod Boev">
    <meta property="og:image" content="https://basedin.nyc/resume/thumb.jpg">
    <meta property="og:url" content="https://basedin.nyc/resume">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/previews.css" />
  </head>
  <body>
    <a class="btn download" href="/resume.pdf" download>Download PDF</a>
    <script src="/pdfjs-dist/build/pdf.min.js"></script>
    <script>
      pdfjsLib.getDocument('/resume.pdf').promise.then(function(pdf) {
        var pages = [];
        for (var i = 1; i <= pdf.numPages; i++) pages.push(i);
        pages.reduce(function(chain, pageNum) {
          return chain.then(function() {
            return pdf.getPage(pageNum).then(function(page) {
              var displayWidth = Math.min(1600 / window.devicePixelRatio, window.innerWidth * 0.96);
              var scale = (displayWidth * 4) / page.getViewport({ scale: 1 }).width;
              var viewport = page.getViewport({ scale: scale });
              var canvas = document.createElement('canvas');
              canvas.width = viewport.width;
              canvas.height = viewport.height;
              return page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise
              .then(function() {
                var img = document.createElement('img');
                img.src = canvas.toDataURL();
                img.style.width = displayWidth + 'px';
                document.body.appendChild(img);
              });
            });
          });
        }, Promise.resolve());
      });
    </script>
  </body>
</html>
