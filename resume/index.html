    <script>
      pdfjsLib.getDocument('/resume.pdf').promise.then(function(pdf) {
        var pages = [];
        for (var i = 1; i <= pdf.numPages; i++) pages.push(i);
        pages.reduce(function(chain, pageNum) {
          return chain.then(function() {
            return pdf.getPage(pageNum).then(function(page) {
              var dpr = window.devicePixelRatio || 1;
              var displayWidth = Math.min(1600 / dpr, window.innerWidth * 0.96);
              var scale = displayWidth / page.getViewport({ scale: 1 }).width;
              var viewport = page.getViewport({ scale: scale });
              return page.getOperatorList().then(function(opList) {
                var svgGfx = new pdfjsLib.SVGGraphics(page.commonObjs, page.objs);
                return svgGfx.getSVG(opList, viewport);
              }).then(function(svg) {
                svg.removeAttribute('width');
                svg.removeAttribute('height');
                svg.style.width = displayWidth + 'px';
                document.body.appendChild(svg);
              });
            });
          });
        }, Promise.resolve());
      });
    </script>
