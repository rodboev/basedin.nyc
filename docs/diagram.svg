  <text x="747" y="437" text-anchor="middle" fill="#95d5b2" font-size="11">thread resolution</text>

  <!-- Rework → Review loop -->
  <path d="M 660,420 C 520,500 280,500 215,412" fill="none" stroke="#52b788" stroke-width="1.5" marker-end="url(#arr2)"/>
