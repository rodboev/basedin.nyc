  <text x="505" y="419" text-anchor="middle" fill="#95d5b2" font-size="11">maintainer feedback</text>
  <text x="505" y="437" text-anchor="middle" fill="#95d5b2" font-size="11">per-repo timing</text>
  <text x="505" y="455" text-anchor="middle" fill="#95d5b2" font-size="11">quiet-window check</text>

  <line x1="602" y1="400" x2="658" y2="400" stroke="#52b788" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="630" y="391" text-anchor="middle" fill="#52b788" font-size="9" font-weight="600">feedback</text>

